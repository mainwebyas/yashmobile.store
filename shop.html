<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop All Accessories — yashmobile.store</title>
  <meta name="description" content="Browse the full range of mobile accessories at yashmobile.store — cases, chargers, cables, power banks, screen protectors, laptop and car accessories." />
  <meta name="theme-color" content="#07152b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="pagehero">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        <span>Shop</span>
      </nav>
      <h1>All accessories</h1>
      <p id="searchNote">One catalogue, every scale — from single orders to bulk procurement.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="toolbar">
        <div class="filterbar" id="filterBar"></div>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <span id="resultCount" style="color:var(--muted);font-size:.88rem"></span>
          <label class="sr-only" for="sortSel">Sort products</label>
          <select id="sortSel">
            <option value="featured">Sort: Featured</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="rating">Top Rated</option>
            <option value="discount">Biggest Discount</option>
          </select>
        </div>
      </div>
      <div class="prodgrid" id="shopGrid"></div>
    </div>
  </section>

  <section class="section section--paper">
    <div class="container">
      <div class="band">
        <div>
          <span class="eyebrow" style="color:var(--cyan)">Buying in bulk?</span>
          <h2>Get volume pricing for your store.</h2>
          <p>Send us your list and quantity — we'll respond with practical, quote-led rates and a delivery plan.</p>
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap">
          <a class="btn btn--primary" href="contact.html">Request a B2B quote</a>
          <a class="btn btn--ghost" href="contact.html">Talk to our team</a>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
