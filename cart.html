<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — yashmobile.store</title>
  <meta name="description" content="Review the items in your yashmobile.store cart and proceed to secure checkout." />
  <meta name="theme-color" content="#07152b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="pagehero">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        <span>Cart</span>
      </nav>
      <h1>Your shopping cart</h1>
      <p>Review your items, adjust quantities and check out securely.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="cartwrap">
        <div id="cartLines"></div>

        <aside class="summary" id="cartSummary">
          <h3>Order summary</h3>
          <div class="summary__row"><span>Subtotal</span><span id="sumSub">₹0</span></div>
          <div class="summary__row" id="sumSaveRow" style="display:none"><span style="color:var(--success)">You save</span><span id="sumSave" style="color:var(--success);font-weight:600">—</span></div>
          <div class="summary__row"><span>Shipping</span><span id="sumShip">FREE</span></div>
          <div class="summary__row total"><span>Total</span><span id="sumTotal">₹0</span></div>
          <a class="btn btn--primary btn--block" id="checkoutBtn" href="checkout.html">Proceed to checkout</a>
          <p class="summary__note">100% secure payment · Razorpay · UPI · Cards</p>
          <a class="btn btn--outline btn--block" href="shop.html" style="margin-top:10px">Continue shopping</a>
        </aside>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
